; desk-robot firmware for the M5Stack StackChan (CoreS3).
; The StackChan BSP needs Arduino core 3.x, which comes from pioarduino rather
; than PlatformIO's stock espressif32 platform (still on core 2.x).
[platformio]
default_envs = stackchan
; Updates over WiFi: copy ota.ini.example to ota.ini (git-ignored) and fill it
; in, then `pio run -e stackchan-ota -t upload`. Skipped if ota.ini is absent.
extra_configs = ota.ini

[env:stackchan]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
board = m5stack-cores3
framework = arduino
monitor_speed = 115200
board_build.partitions = default_16MB.csv
# Quiet the core's "connection reset" spam while the brain server is down.
build_flags =
    -DCORE_DEBUG_LEVEL=0
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1
lib_deps =
    m5stack/M5Unified@^0.2.26
    m5stack/M5GFX@^0.2.27
    ; BSP main as of 2026-08-28: the 1.1.0 release doesn't build against
    ; M5Unified 0.2.26's IO-expander API. Back to a version once one ships.
    https://github.com/m5stack/StackChan-BSP.git#8d4d6fc3b7a6be379c6317c45a02a30bff8c492e
    links2004/WebSockets@^2.6.1
    bblanchon/ArduinoJson@^7.0.0
